# ---------------------------------------------------------------
# Maven Central Publishing — Central Portal credentials
# Obtain a user token at: https://central.sonatype.com/account
# ---------------------------------------------------------------
# mavenCentralUsername=<your-portal-token-username>
# mavenCentralPassword=<your-portal-token-password>

# ---------------------------------------------------------------
# GPG Signing
# Option A — keyring file (local machine)
# ---------------------------------------------------------------
# signing.keyId=<last-8-chars-of-key-id>
# signing.password=<gpg-passphrase>
# signing.secretKeyRingFile=/home/<you>/.gnupg/secring.gpg

# ---------------------------------------------------------------
# GPG Signing
# Option B — in-memory key (recommended for CI / GitHub Actions)
# Export with: gpg --export-secret-keys --armor <key-id>
# ---------------------------------------------------------------
# signing.key=<paste full PGP PRIVATE KEY BLOCK here>
# signing.password=<gpg-passphrase>
